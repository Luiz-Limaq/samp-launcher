<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launcher SAMP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #28a745;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .server-list {
            margin-top: 20px;
        }
        .server-item {
            background-color: #f9f9f9;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }
        .server-info {
            font-size: 14px;
            margin: 5px 0;
        }
        .favorite {
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Launcher SAMP</h1>

    <!-- Formulário para adicionar servidor -->
    <input type="text" id="inputIp" placeholder="Digite IP:Porta" />
    <button onclick="adicionarServidor()">Adicionar Servidor</button>

    <!-- Lista de servidores -->
    <div class="server-list" id="serverList">
        <!-- Servidores serão listados aqui -->
    </div>
</div>

<script>
    // Função para adicionar servidor
    function adicionarServidor() {
        const inputIp = document.getElementById("inputIp").value;
        const inputPorta = document.getElementById("inputPorta").value;

        if (inputIp && inputPorta) {
            const server = { ip: inputIp, porta: inputPorta };
            saveServerToLocalStorage(server);
            inputIp.value = ''; // Limpar o campo após adicionar
            carregarServidores();
        } else {
            alert('Por favor, preencha os campos de IP e Porta!');
        }
    }

    // Função para salvar servidor no localStorage
    function saveServerToLocalStorage(server) {
        let servers = JSON.parse(localStorage.getItem('servers')) || [];
        servers.push(server);
        localStorage.setItem('servers', JSON.stringify(servers));
    }

    // Função para carregar servidores
    function carregarServidores() {
        const servers = JSON.parse(localStorage.getItem('servers')) || [];
        const serverList = document.getElementById("serverList");
        serverList.innerHTML = ''; // Limpar a lista de servidores

        servers.forEach(server => {
            const serverItem = document.createElement('div');
            serverItem.classList.add('server-item');
            serverItem.innerHTML = `
                <div class="server-info">
                    IP: ${server.ip} : ${server.porta}
                </div>
                <div class="favorite">
                    <input type="checkbox" id="fav-${server.ip}" onchange="marcarFavorito('${server.ip}')">
                    <label for="fav-${server.ip}">Favorito</label>
                </div>
                <button onclick="consultarStatus('${server.ip}', '${server.porta}')">Consultar Status</button>
                <button onclick="removerServidor('${server.ip}')">Remover Servidor</button>
            `;
            serverList.appendChild(serverItem);
        });
    }

    // Função para consultar status do servidor (simulado)
    function consultarStatus(ip, porta) {
        fetch(`https://api.open.mp/servers?ip=${ip}&port=${porta}`)
            .then(response => response.json())
            .then(data => {
                const status = `Jogadores: ${data.players}/100, Ping: ${data.ping}ms`;
                alert('Status do Servidor: ' + status);
            })
            .catch(error => {
                console.error('Erro ao consultar o servidor:', error);
                alert('Erro ao consultar o servidor!');
            });
    }

    // Função para marcar servidor como favorito
    function marcarFavorito(ip) {
        alert(`${ip} marcado como favorito!`);
        // Salvar status de favorito no localStorage se necessário
    }

    // Função para remover servidor
    function removerServidor(ip) {
        let servers = JSON.parse(localStorage.getItem('servers')) || [];
        servers = servers.filter(server => server.ip !== ip);
        localStorage.setItem('servers', JSON.stringify(servers));
        carregarServidores();
    }

    // Carregar servidores ao carregar a página
    window.onload = carregarServidores;
</script>

</body>
</html>
